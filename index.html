<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>七年级英语单词精英训练营</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#121619; --card:#1A2025; --card-2:#232B32; --ink:#EEF1F3; --muted:#8A96A0;
  --gold:#FFD700; --gold-d:#B8860B; --orange:#FF9500; --orange-d:#CC5E00;
  --green:#7CB342; --green-d:#558B2F; --red:#FF5252; --blue:#29B6F6;
  --line:#2C343C; --line-gold:#4A3B12;
  --shadow-gold:0 0 10px rgba(255,215,0,.35);
  --shadow-neon:0 0 10px rgba(41,182,246,.35);
  --ipa:"Segoe UI","Lucida Sans Unicode","DejaVu Sans","Arial Unicode MS",Arial,sans-serif;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
  padding-bottom:50px;
  background-image:linear-gradient(rgba(255,215,0,.025) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(255,215,0,.025) 1px, transparent 1px);
  background-size:22px 22px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{background:linear-gradient(180deg,#182025 0%,#121619 100%);
  color:var(--gold);padding:14px 0 12px;position:sticky;top:0;z-index:50;
  border-bottom:1px solid var(--line-gold);box-shadow:0 4px 18px rgba(0,0,0,.55)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:16px;font-weight:800;letter-spacing:.5px;
  text-shadow:0 0 8px rgba(255,215,0,.35);color:#fff}
.brand small{display:block;font-size:11px;font-weight:600;opacity:.8;letter-spacing:0;color:var(--gold-d);margin-top:2px}
.gear{background:rgba(255,215,0,.12);border:1px solid var(--gold-d);border-radius:99px;color:var(--gold);
  font-size:13px;padding:7px 14px;cursor:pointer;font-weight:600;box-shadow:0 0 8px rgba(255,215,0,.15)}
nav{background:#161B20;border-bottom:1px solid var(--line-gold);position:sticky;top:0;z-index:49}
nav .wrap{display:flex;gap:6px;overflow-x:auto;padding:7px 14px;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-size:13px;padding:8px 13px;border-radius:99px;cursor:pointer;white-space:nowrap;font-weight:600}
nav button.on{background:linear-gradient(180deg,rgba(255,215,0,.18) 0%,rgba(255,140,0,.12) 100%);color:var(--gold);border:1px solid var(--gold-d);box-shadow:var(--shadow-gold)}
main{padding-top:16px}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.card.gold{border-color:var(--line-gold);box-shadow:0 0 14px rgba(255,215,0,.12),0 8px 22px rgba(0,0,0,.35)}
h2.sec{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--gold);text-shadow:0 0 6px rgba(255,215,0,.25)}
h2.sec:before{content:"";width:4px;height:16px;background:linear-gradient(180deg,var(--gold),var(--orange));border-radius:2px;box-shadow:0 0 6px var(--gold-d)}
.btn{border:0;border-radius:12px;background:linear-gradient(180deg,var(--gold) 0%,#DAA520 100%);color:#1A1200;font-size:15px;padding:12px 18px;cursor:pointer;font-family:inherit;font-weight:800;box-shadow:0 5px 0 #8B6914,0 0 12px rgba(255,215,0,.25);transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8B6914}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold-d);box-shadow:inset 0 0 10px rgba(255,215,0,.08),0 0 8px rgba(255,215,0,.1)}
.btn.wide{width:100%}.btn.sm{font-size:13px;padding:8px 13px}
.row{display:flex;gap:10px;align-items:center}
.hp{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.bar{height:9px;background:#252D35;border-radius:99px;overflow:hidden;border:1px solid #2F3942}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:99px;transition:width .4s;box-shadow:0 0 8px var(--gold-d)}
.unit{display:flex;align-items:center;gap:14px}
.unit .txt{flex:1;min-width:0}.unit .tt{font-size:16px;font-weight:700;color:#fff}
.unit .st{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--card-2);color:var(--gold);border:1px solid var(--line-gold)}
.pill.g{background:rgba(124,179,66,.15);color:var(--green);border-color:rgba(124,179,66,.35)}
.pill.y{background:rgba(255,215,0,.12);color:var(--gold);border-color:var(--gold-d)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.unitbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.unitbar::-webkit-scrollbar{display:none}
.unitbar button{flex:0 0 auto}
.mini{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.mini .n{font-size:24px;font-weight:800;line-height:1.2;background:linear-gradient(180deg,var(--gold),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.mini .l{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}
.face{background:linear-gradient(135deg,#232B32 0%,#1A2025 100%);border:1px solid var(--line-gold);border-radius:20px;padding:26px 16px;text-align:center;cursor:pointer;min-height:240px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;box-shadow:0 0 28px rgba(255,215,0,.12),0 12px 30px rgba(0,0,0,.4)}

.face .w{font-size:32px;font-weight:800;letter-spacing:.5px;word-break:break-word;line-height:1.25;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.face .ipa{font-family:var(--ipa);font-size:17px;color:#BFC8CE}
.face .cn{font-size:18px;color:var(--gold);font-weight:700}
.face .pos{font-size:13px;color:var(--muted)}
.face .hint{position:absolute;bottom:10px;font-size:11.5px;color:#6E7A83}
.spk{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--orange));border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;box-shadow:0 0 12px rgba(255,215,0,.3)}
.spk:active{filter:brightness(.9)}
.spk svg{width:22px;height:22px}
.opt{display:block;width:100%;text-align:left;background:var(--card-2);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;font-size:16px;cursor:pointer;font-family:inherit;color:var(--ink);margin-bottom:10px;font-weight:600}
.opt.right{border-color:var(--green);background:rgba(124,179,66,.15);color:var(--green);box-shadow:0 0 10px rgba(124,179,66,.2)}
.opt.wrong{border-color:var(--red);background:rgba(255,82,82,.12);color:var(--red);box-shadow:0 0 10px rgba(255,82,82,.2)}
input[type=text]{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font-size:18px;font-family:inherit;background:var(--card-2);color:var(--ink);font-weight:600}
input[type=text]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 10px rgba(255,215,0,.2)}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.ph{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer}
.ph .s{font-family:var(--ipa);font-size:20px;font-weight:700;background:linear-gradient(180deg,var(--gold),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ph .k{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph.on{border-color:var(--gold);background:rgba(255,215,0,.12);box-shadow:var(--shadow-gold)}
.detail{background:rgba(41,182,246,.08);border:1px solid rgba(41,182,246,.2);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow-neon)}
.detail .big{font-family:var(--ipa);font-size:38px;font-weight:800;background:linear-gradient(180deg,var(--blue),#81D4FA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.detail .tip{font-size:12.5px;color:#A8B4BC;text-align:center;margin:6px 0 12px}
.wchip{display:inline-block;font-size:13px;background:var(--card-2);border:1px solid var(--line);border-radius:99px;
  padding:5px 12px;margin:0 6px 6px 0;cursor:pointer;color:var(--ink);font-weight:600}
.wchip .em{margin-right:4px}.wchip:active{background:rgba(255,215,0,.12);border-color:var(--gold-d)}
.pass{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:11px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.pass .t{font-size:15.5px;font-weight:700;color:#fff}
.pass .d{font-size:12.5px;color:var(--muted);margin-top:3px}
.sent{padding:9px 12px;border-radius:10px;cursor:pointer;margin-bottom:4px;transition:background .15s;background:rgba(255,255,255,.02)}
.sent:hover{background:rgba(255,215,0,.08)}
.sent.playing{background:rgba(255,215,0,.15);border-left:3px solid var(--gold)}
.en{font-size:16.5px;line-height:1.8}
.zh{font-size:14px;color:var(--muted);line-height:1.75;display:none;margin-top:3px}
.zh.on{display:block}
.hl{color:var(--gold);font-weight:700;border-bottom:2px solid var(--gold-d);cursor:pointer;text-shadow:0 0 4px rgba(255,215,0,.3)}
.wrong-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.wrong-item:last-child{border-bottom:0}
.wrong-item .ico{font-size:28px}
.wrong-item .w{font-size:16px;font-weight:700;color:#fff}
.wrong-item .m{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:36px 12px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(16px);background:rgba(20,24,28,.95);
  color:var(--gold);font-size:14px;padding:11px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:88%;text-align:center;border:1px solid var(--gold-d);box-shadow:var(--shadow-gold);font-weight:700}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(10,12,14,.7);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line-gold);border-radius:18px;padding:20px;max-width:420px;width:100%;box-shadow:0 0 30px rgba(0,0,0,.5)}
.modal h3{font-size:17px;margin-bottom:14px;color:var(--gold);font-weight:800}
label.opt-row{display:flex;align-items:center;gap:9px;font-size:14px;padding:7px 0;cursor:pointer;color:var(--ink)}
textarea{width:100%;min-height:150px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:14px;
  font-family:inherit;line-height:1.6;resize:vertical;background:var(--card-2);color:var(--ink)}
textarea:focus{outline:none;border-color:var(--gold)}
.note{font-size:12.5px;color:var(--muted);line-height:1.65}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(255,215,0,.12);color:var(--gold);border:1px solid var(--gold-d);margin-left:6px}
footer{text-align:center;font-size:12px;color:#5E6A73;padding:24px 14px 10px;line-height:1.7}
.rank-card{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,rgba(255,215,0,.12),rgba(255,140,0,.08));border:1px solid var(--line-gold);border-radius:14px;padding:13px 15px;margin-bottom:14px}
.rank-ico{font-size:38px;filter:drop-shadow(0 0 6px rgba(255,215,0,.4))}
.rank-info{flex:1}.rank-name{font-size:18px;font-weight:800;color:var(--gold);text-shadow:0 0 6px rgba(255,215,0,.3)}
.rank-next{font-size:12px;color:var(--muted);margin-top:2px}
.score-total{font-size:13px;color:var(--muted)}
.score-num{font-size:26px;font-weight:800;background:linear-gradient(180deg,var(--gold),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.map-title{font-size:14px;font-weight:700;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.map-title:before{content:"🗺️"}
.map-row{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cp{width:42px;height:42px;border-radius:50%;background:var(--card-2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;z-index:2}
.cp.locked{opacity:.45;filter:grayscale(.8)}
.cp.done{background:linear-gradient(135deg,var(--gold),var(--orange));border-color:#fff;box-shadow:0 0 14px var(--gold-d);font-weight:800}
.cp.current{border-color:var(--blue);box-shadow:var(--shadow-neon);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(41,182,246,0)}50%{box-shadow:0 0 14px rgba(41,182,246,.55)}}
.path-line{flex:1;height:4px;background:#2C343C;border-radius:2px;position:relative}
.path-line.done{background:linear-gradient(90deg,var(--gold),var(--orange));box-shadow:0 0 6px var(--gold-d)}
.stars{margin-top:4px;text-align:center;font-size:12px;letter-spacing:1px}
.stars .on{color:var(--gold);text-shadow:0 0 4px var(--gold-d)}
.stars .off{color:#3A464F}
.hero-card{background:linear-gradient(135deg,#1E252B 0%,#151A1E 100%);border:1px solid var(--line-gold);border-radius:16px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.hero-card:after{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;background:radial-gradient(circle,rgba(255,215,0,.18),transparent 70%);border-radius:50%}
.mission-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.mission-row::-webkit-scrollbar{display:none}
.mission-card{flex:0 0 auto;width:110px;background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:13px 8px;text-align:center;cursor:pointer;transition:transform .1s}
.mission-card:active{transform:scale(.97)}
.mission-card .em{font-size:30px;margin-bottom:6px}
.mission-card .t{font-size:12px;font-weight:700;color:#fff}.mission-card .d{font-size:11px;color:var(--muted);margin-top:2px}
@media(max-width:400px){.face .w{font-size:28px}.brand{font-size:15px}.rank-ico{font-size:32px}}
header.hero{position:relative;z-index:50;border-bottom:2px solid var(--line-gold);line-height:0;padding:0;box-shadow:0 6px 22px rgba(0,0,0,.55)}
header.hero .hero-img{width:100%;height:40vw;max-height:220px;min-height:140px;object-fit:cover;object-position:center;display:block}
header.hero .hero-ov{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 12px;line-height:1.4;background:linear-gradient(180deg,rgba(8,11,14,0) 0%,rgba(8,11,14,.55) 45%,rgba(8,11,14,.92) 100%)}
header.hero .hero-title{font-size:20px;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.85)}
header.hero .hero-sub{font-size:12px;color:#FFD700;font-weight:700;margin-top:3px;text-shadow:0 1px 5px rgba(0,0,0,.85)}
header.hero .gear{position:absolute;top:10px;right:12px}
.ill{display:inline-flex;align-items:center;justify-content:center}
.ill svg{width:100%;height:100%;display:block}
.ill.ic{color:var(--gold)}
.ill.ic svg{color:var(--gold);filter:drop-shadow(0 0 6px rgba(255,215,0,.35))}
.face .ico{display:flex;align-items:center;justify-content:center;width:min(54vw,205px);height:min(54vw,205px);filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.face .ico .ill{width:100%;height:100%}
.face .ico .ill.emo{font-size:min(46vw,160px);line-height:1;width:auto;height:auto}
.quiz-ill{display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.quiz-ill .ill{width:min(42vw,155px);height:min(42vw,155px)}
.quiz-ill .ill.emo{font-size:min(34vw,115px);line-height:1;width:auto;height:auto}
.wrong-item .ico .ill{width:36px;height:36px}
.wrong-item .ico .ill.emo{font-size:30px;line-height:1;width:auto;height:auto}
</style>

</head>

{id:"s1",unit:"starter",title:"Our New School",tag:"开学 · 校园",
 en:["Our junior high is big and new.","I am in Class Three. Our classroom is on the second floor of the teaching building.","Every morning we put on our school uniform. We wear a red scarf too.","In the dining hall we have lunch together.","We have many subjects: geography, biology and history.","We also have a lab. We do fun things there.","I often forget my eraser, so I keep one in my textbook.","Of course we are a bit nervous at the start.","But it is good to be here."],
 zh:["我们的初中又大又新。","我在三班。我们的教室在教学楼的二楼。","每天早上我们穿上校服，还会戴上红领巾。","我们在食堂一起吃午饭。","我们有很多科目：地理、生物和历史。","我们还有一个实验室，在那里做有趣的事。","我经常忘带橡皮，所以我在课本里放了一块。","刚开始我们当然有点紧张。","但能来到这里，挺好的。"],
 words:["junior high","teaching building","school uniform","red scarf","dining hall","together","geography","biology","history","lab","fun","forget","eraser","textbook","of course","a bit","nervous","start"],

    {q:"「我」为什么在课本里放一块橡皮？",a:["因为经常忘带橡皮","因为课本喜欢橡皮","因为老师要求"],r:0},
    {q:"文章里「我们」平时午餐是怎么吃的？",a:["各吃各的","在食堂一起吃","在教室吃"],r:1}]},
{id:"s2",unit:"starter",title:"Nice to Meet You",tag:"开学 · 认识新朋友",
 en:["Today is our first day. Everyone is new.","Our teacher says, \"Please introduce yourself to each other.\"","I stand up and say my name. My face is red and I feel nervous.","But a boy smiles at me. He asks about my hobby.","I tell him I like football. He asks me to join his team.","\"We can take part in the school match together,\" he says.","Now I know: if you are ready to say hello first, you will not be alone.","I want to explore this new school with my new friends."],
 zh:["今天是我们的第一天。每个人都是新来的。","老师说：「请互相介绍一下自己。」","我站起来说自己的名字。我的脸红了，心里很紧张。","但有个男生对我笑了笑。他问我有什么爱好。","我告诉他我喜欢足球。他邀请我加入他的队。","「我们可以一起参加学校的比赛。」他说。","现在我知道了：如果你愿意先开口打招呼，就不会孤单。","我想和我的新朋友一起探索这所新学校。"],
 words:["everyone","introduce","yourself","each other","nervous","hobby","join","team","take part in","together","ready","explore"],
 q:[{q:"老师让同学们做什么？",a:["写作业","互相介绍自己","打扫教室"],r:1},
    {q:"那个男生为什么来找「我」说话？",a:["想问「我」的爱好","想借橡皮","想抄作业"],r:0}]},
{id:"u11",unit:"u1",title:"How to Remember a New Word",tag:"学习方法 · 记单词",
 en:["Many students ask: what is the best way to remember a new word?","Here is some advice from my teacher.","First, do not just look at the meaning. Point out the part you do not know.","Second, put the word in a sentence. In fact, a sentence helps you more than a long list.","Third, plan your time. Ten minutes a day is better than one hour a week.","If you make a mistake, do not worry. A mistake is a good teacher.","Remember: the most important thing is not your memory. It is your habit.","Keep your mind open, and every task becomes easy.","And one more thing: your homework is not a problem. It is a small journey."],
 zh:["很多同学问：记住一个新单词最好的办法是什么？","这里有一些我老师的建议。","第一，不要只看中文意思。把你不会的那部分指出来。","第二，把这个词放进一个句子里。事实上，句子比长长的单词表更有用。","第三，安排好时间。每天十分钟，比一周一小时更有效。","如果你犯了错，别担心。错误是个好老师。","记住：最重要的不是你的记忆力，而是你的习惯。","保持头脑开放，每个任务都会变得简单。","还有一件事：你的作业不是难题，它是一段小小的旅程。"],
 words:["remember","advice","meaning","point out","sentence","in fact","plan","mistake","important","mind","task","homework","problem","journey"],
 q:[{q:"文章建议背单词时不要怎么做？",a:["只看中文意思就够了","把词放进句子","安排时间"],r:0},
    {q:"「A mistake is a good teacher」这句话的意思是？",a:["犯错很丢人","从错误里能学到东西","最好不要犯错"],r:1}]},
{id:"u12",unit:"u1",title:"A Boat, A Wind, A Hope",tag:"成长 · 向前走",
 en:["A small boat sails on a wide river.","Without a good wind, it cannot move fast.","It goes through a narrow place and towards the sea.","One day a storm comes. The rain is heavy and the boy on the boat is not dry.","He is afraid. He hopes the storm will stop soon.","He finds a small pool behind a rock and hides there.","He thinks about his journey. It is hard, but it is his own journey.","When the sky is clear again, he says to himself: \"I will protect this boat. I will sail on.\""],
 zh:["一只小船在宽阔的河面上航行。","没有好的风，它走不快。","它穿过一个狭窄的地方，朝着大海去。","有一天暴风雨来了。雨很大，船上的男孩浑身都湿了。","他很害怕。他希望暴风雨快点停。","他在一块岩石后面找到一个小水塘，躲了进去。","他想着自己的旅程。很难，但这是他自己的旅程。","当天又放晴的时候，他对自己说：「我会保护好这条船，继续航行。」"],
 words:["sail","wide","without","wind","through","towards","storm","pool","journey","hope","protect"],
 q:[{q:"小船为什么走不快？",a:["船太小","没有好的风","河水太少"],r:1},
    {q:"暴风雨来的时候，男孩做了什么？",a:["躲到岩石后面的水塘里","继续往前冲","跳下船"],r:0},
    {q:"文章想告诉我们什么？",a:["坐船很危险","遇到难事也要守住自己的方向，继续走","下雨天不要出门"],r:1}]},
{id:"u21",unit:"u2",title:"Our School Club Day",tag:"校园 · 社团节",
 en:["Every September our school holds a club festival.","The playground is full of colour and sound.","Some students play rock music on an electric guitar.","Others sing a traditional song on the stage.","In one classroom, a girl shows us paper-cutting.","\"Would you like to join a club?\" a boy asks me.","I am not sure, so I walk around and look at every club.","I enjoy watching the guitar band practice.","Everybody is smiling and talking to new classmates.","At last I decide to join the music club.","It is a different day, and I like it."],
 zh:["每年九月，我们学校都会办社团节。","操场上满是色彩和声音。","有些同学用电吉他弹摇滚乐。","另一些同学在舞台上唱一首传统歌。","在一间教室里，一个女生给我们展示剪纸。","「你想加入一个社团吗？」一个男生问我。","我不太确定，所以我走了一圈，看完了每个社团。","我很喜欢看吉他乐队练习。","每个人都在笑，都在和新同学说话。","最后我决定加入音乐社团。","这是不一样的一天，我喜欢。"],
 words:["club","festival","hold","sound","rock music","electric","guitar","traditional","stage","paper-cutting","join","enjoy","practice","everybody","classmate","decide","different","smile"],
 q:[{q:"学校九月办的是什么活动？",a:["运动会","社团节","家长会"],r:1},
    {q:"「我」最后决定加入什么？",a:["音乐社团","排球社团","剪纸社团"],r:0}]},
{id:"u22",unit:"u2",title:"A Song at Midnight",tag:"成长 · 一个人待着",
 en:["It is almost midnight, but I am still awake.","I sit on the ground by the window with my notebook open.","The page is empty. I feel a little lonely.","Then a sound appears from the garden.","Something is tapping on the glass, like a small drum.","I shake my head and listen again.","It is only the wind and the leaves, but it is magic to me.","High in the sky, the moon looks down at the ground.","I write down three words in my notebook: nature, sound, joy.","Every night has an ending. Now I can leave my seat and sleep."],
 zh:["快到午夜了，可我还醒着。","我坐在窗边的地上，笔记本摊开着。","页面是空的。我有一点孤单。","这时，花园里传来一个声音。","有什么东西在敲玻璃，像一面小鼓。","我摇摇头，再听一次。","其实只是风和叶子，但对我来说，这很神奇。","高高的天上，月亮看着地面。","我在笔记本上写下三个词：自然、声音、喜悦。","每个夜晚都有结尾。现在我可以离开座位，去睡觉了。"],
 words:["almost","midnight","awake","ground","notebook","page","lonely","sound","appear","tap","shake","magic","high","nature","joy","ending","leave"],
 q:[{q:"那个声音其实是什么？",a:["风和叶子","一只小猫","邻居的鼓"],r:0},
    {q:"「我」在笔记本上写了什么？",a:["一首歌","三个词","家庭作业"],r:1}]},
{id:"u31",unit:"u3",title:"My Father's Hands",tag:"亲情 · 父亲",
 en:["My father is a silent man. He seldom says much.","When I was small, he carried me along the road on his back.","He was handsome then, and he still is.","Sometimes he was strict with me, and I hid my tears.","But I have one clear memory of him.","One cold morning he pulled my hand and walked with me to school.","He said nothing, and only followed the road slowly.","At the gate he gave me a quick hug and left.","Now I understand: his care was there all the time.","I am his son, and his love is a quiet, touching thing."],
 zh:["我父亲是个沉默的人。他很少说太多话。","我小的时候，他背着我沿着路走。","那时候他很英俊，现在也还是。","有时候他对我很严格，我就把眼泪藏起来。","但关于他，我有一个很清楚的记忆。","一个寒冷的早上，他拉起我的手，和我一起走路上学。","他什么也没说，只是慢慢地沿着路走。","在校门口，他很快地抱了我一下，就走了。","现在我才明白：他的关心一直都在。","我是他的儿子，他的爱是安静的、动人的。"],
 words:["silent","seldom","carry","along","road","handsome","strict","hide","tear","memory","pull","follow","hug","care","son","touching"],
 q:[{q:"父亲的性格是怎样的？",a:["爱说话，很热闹","沉默，很少说话","很爱生气"],r:1},
    {q:"「我」最后明白了什么？",a:["父亲的关心一直都在","父亲不喜欢我","父亲工作很忙"],r:0}]},
{id:"u32",unit:"u3",title:"The Postman on the Mountain Road",tag:"人物 · 坚持",
 en:["Mr Lin is a postman. He has served in this mountain area for thirty years.","His position is small, but he is never absent.","Every morning he carries a heavy bag and walks along the mountain road.","He has never refused a letter, even in heavy rain.","Once he was ill. The doctor said it was a serious disease and told him to stay home.","But the result was the same: he picked up his bag and went out again.","Sometimes a driver picks him up in a trailer, and he is very happy about it.","The people here care about him a lot.","He says every house across the road is a memory he will never forget.","He is not an actress and he is not a queen. He is just our postman."],
 zh:["林先生是一名邮递员。他在这个山区服务了三十年。","他的职位很小，但他从不缺席。","每天早上他背着一个很重的包，沿着山路走。","他从没拒收过一封信，连大雨天也一样。","有一次他病了。医生说是很严重的病，让他在家待着。","但结果还是一样：他拎起包又出门了。","有时候有司机用拖车捎他一段，他就特别开心。","这里的人都很关心他。","他说，路对面的每一户人家，都是他永远不会忘的记忆。","他不是女演员，也不是女王。他就是我们的邮递员。"],
 words:["postman","serve","position","area","absent","carry","along","mountain","road","refuse","serious","disease","stay","result","pick up","trailer","care","across","memory","actress","queen"],
 q:[{q:"林先生做邮递员多久了？",a:["三年","十三年","三十年"],r:2},
    {q:"他生病的时候做了什么？",a:["在家休息","还是拎起包出门送信","让别人替他送"],r:1}]},
{id:"u41",unit:"u4",title:"The Reunion Dinner",tag:"节日 · 团圆饭",
 en:["On New Year's Eve our whole family has a reunion dinner.","My grandmother makes dumplings. The smell fills the whole house.","I help her cut a cucumber with a small knife.","There is pork, fish, and many other dishes on the table.","The dumplings are round, like a full moon.","She says the round shape means the family will stay together.","We hang a red lantern and watch the fireworks outside.","My uncle tells a joke, and everyone laughs.","Then I realise something important.","We are not celebrating the food. We are celebrating being together.","I treat this night as the best night of the whole year."],
 zh:["除夕那天，我们全家一起吃团圆饭。","我奶奶包饺子。香味充满了整个屋子。","我帮她用小刀切黄瓜。","桌上有猪肉、鱼，还有很多别的菜。","饺子是圆的，像一轮满月。","她说，圆的形状意味着家人会一直在一起。","我们挂起红灯笼，看外面的烟花。","我叔叔讲了个笑话，大家都笑了。","然后我意识到一件重要的事。","我们不是在庆祝这些菜，我们是在庆祝团圆。","我把这一晚当成一整年里最好的一晚。"],
 words:["whole","reunion","dumpling","smell","fill","cucumber","knife","pork","dish","round","shape","lantern","firework","joke","laugh","realise","celebrate","treat"],
 q:[{q:"奶奶说饺子为什么是圆的？",a:["因为好看","代表团圆，家人在一起","因为容易包"],r:1},
    {q:"作者最后意识到什么？",a:["菜很好吃","庆祝的不是食物，而是团圆","饺子很难做"],r:1}]},
{id:"u42",unit:"u4",title:"Too Much Waste",tag:"环保 · 少用塑料",
 en:["Last Christmas I got a lot of plastic toys.","I played with them for two days, and then threw them away.","Later I watched a short film about pollution.","I was shocked. So much waste comes from things we use for one meal.","On a break from class, I asked my teacher about the situation.","She said it is a big challenge, but every small decision helps.","We can use a glass dish instead of a plastic one.","We can buy only what we need, and not throw food away.","I will not regret this. I need no support from anyone.","Taking care of the earth is not only a law. It is our duty."],
 zh:["去年圣诞节，我收到很多塑料玩具。","我玩了两天，就把它们扔掉了。","后来我看了一部关于污染的短片。","我很震惊。原来这么多垃圾，都来自我们用一餐就丢的东西。","课间休息时，我问老师这个情况。","她说这是个很大的挑战，但每个小小的决定都有用。","我们可以用玻璃盘，而不是塑料的。","我们只买需要的东西，不浪费食物。","我不会后悔这么做，也不需要任何人的支持。","爱护地球不只是法律，它是我们的责任。"],
 words:["Christmas","plastic","throw away","pollution","shocked","waste","meal","break","situation","challenge","decision","dish","throw","regret","support","law","duty"],
 q:[{q:"作者为什么震惊？",a:["玩具太贵","很多东西用一次就成了垃圾","短片很长"],r:1},
    {q:"老师说每个小决定的作用是？",a:["都有帮助","没有用","只有大人能做"],r:0}]},
{id:"u51",unit:"u5",title:"How a Plant Grows",tag:"自然 · 植物的秘密",
 en:["A seed is a small and quiet thing.","Put it in the dark soil, and soon a root comes out.","Then a stem rises, and small leaves open one by one.","The leaves collect light from the sun.","The plant mixes water and air, and produces sugar for itself.","As a natural part of this work, it also gives out oxygen.","That is why every human can breathe.","Not all plants are the same.","Bamboo grows very fast, but a rose grows slowly and quietly.","In the rainforest, plants grow so close that they almost touch each other.","Plants give us cotton, food and good news for our health.","Taking a rest in a green place is a key part of a good life."],
 zh:["种子是一种很小、很安静的东西。","把它放进黑暗的土里，很快根就会出来。","然后茎会升起，小叶子一片一片打开。","叶子从太阳那里收集光。","植物把水和空气混合起来，为自己制造糖分。","作为这项工作的自然的一部分，它还会放出氧气。","这就是每个人能呼吸的原因。","不是所有植物都一样。","竹子长得很快，玫瑰却长得又慢又安静。","在雨林里，植物长得密到几乎互相碰到。","植物给我们提供棉花、食物，还有关于健康的好消息。","在绿色的地方休息一下，是过好日子很关键的一部分。"],
 words:["seed","dark","soon","root","stem","rise","leaf","collect","mix","produce","sugar","natural","part","oxygen","human","breathe","bamboo","rose","rainforest","cotton","news","health","key","rest"],
 q:[{q:"植物为人提供的、让人能呼吸的是什么？",a:["糖分","氧气","水"],r:1},
    {q:"文中说竹子生长有什么特点？",a:["长得很快","长得又慢又安静","不长叶子"],r:0}]},
{id:"u52",unit:"u5",title:"Tea in the Yard",tag:"生活 · 一杯茶",
 en:["On the weekend my family sits in the yard and drinks tea.","My father prefers coffee, but my mother never changes her tea.","She puts a few biscuits on a small plate for all of us.","We chat about school, the weather and the news.","Tea is more than a drink in our culture.","It is a way to connect with people you love.","Once I asked my mother for her secret.","She said, \"There is no secret. You just need to sit down.\"","Many adults are too busy to sit down. That is not good for their health.","This is why tea is still so popular in our country.","I hope I will keep this small habit all my life."],
 zh:["周末，我们一家坐在院子里喝茶。","我爸爸更喜欢咖啡，但我妈妈一直喝她的茶。","她给我们每人放几块饼干在小碟子上。","我们聊学校、天气和新闻。","在我们的文化里，茶不只是一杯喝的。","它是和你爱的人连接的一种方式。","有一次我问妈妈她的秘诀是什么。","她说：「没有什么秘诀，你只需要坐下来。」","很多成年人太忙了，坐不下来。这对他们的健康不好。","这就是茶在我们国家依然这么受欢迎的原因。","我希望这个小习惯能陪我一辈子。"],
 words:["weekend","yard","prefer","coffee","biscuit","chat","news","culture","connect","secret","adult","health","popular"],
 q:[{q:"妈妈说的「秘诀」是什么？",a:["一种特别的茶叶","没有什么秘诀，只是坐下来","要放很多糖"],r:1},
    {q:"为什么茶在中国依然这么受欢迎？",a:["因为它很便宜","因为它是连接人的方式","因为只有大人能喝"],r:1}]},
{id:"u61",unit:"u6",title:"The Dodo Is Gone",tag:"动物 · 灭绝",
 en:["Long ago, a big bird lived on a small island in the ocean.","Its name was the dodo.","When people arrived on the island, the dodo was not afraid.","It was a friendly bird, and it could not fly.","In the forest there was plenty of food, so life was peaceful.","But people hunted the dodo, and other animals ate its eggs.","Soon every dodo was dead.","Today we say a thing is \"as dead as a dodo\" when it is gone forever.","The dodo died out because it trusted everyone.","Now you can only see one in a museum, or as a character in a book.","We cannot save the dodo, but we can save the animals that are still here."],
 zh:["很久以前，一只大鸟住在海洋中的一个小岛上。","它的名字叫渡渡鸟。","当人们来到岛上时，渡渡鸟一点也不怕人。","它是友善的鸟，而且不会飞。","森林里食物充足，所以生活很平静。","但人们猎杀渡渡鸟，别的动物也吃它的蛋。","很快，所有的渡渡鸟都死了。","今天说一样东西彻底消失，我们就说 as dead as a dodo。","渡渡鸟灭绝，是因为它相信所有人。","现在你只能在博物馆里看到它，或者把它当成书里的一个角色。","我们救不了渡渡鸟，但我们可以救还在这里的动物。"],
 words:["island","ocean","arrive","friendly","forest","plenty","peaceful","hunt","dead","die","die out","as dead as a dodo","museum","character","save"],
 q:[{q:"渡渡鸟为什么灭绝了？",a:["天气太冷","人们猎杀它，别的动物吃它的蛋","它飞走了"],r:1},
    {q:"「as dead as a dodo」是什么意思？",a:["彻底消失、完蛋","睡得很沉","跑得很快"],r:0}]},
{id:"u62",unit:"u6",title:"A Penguin and a Pigeon",tag:"动物 · 各自的本领",
 en:["A penguin and a pigeon meet by the sea.","The penguin says, \"I can swim several kilometres at great speed.\"","The pigeon says, \"I can fly home and never get lost.\"","They look at themselves in the water, like a mirror.","Then a man comes and feeds them.","\"What a surprise!\" says the pigeon. \"This is not boring at all.\"","He knocks around the beach and picks up small pieces of food.","The penguin is not scary, and it is not a hero.","Maybe it is just an amazing animal, and that is enough.","A scientist does research on them, and can recognise each one.","One day an engineer builds them a small house by the sea.","The penguin says, \"Fantastic. Now we have a home.\""],
 zh:["一只企鹅和一只鸽子在海边相遇。","企鹅说：「我能用很快的速度游好几公里。」","鸽子说：「我能飞回家，永远不会迷路。」","它们在水里看自己，水面就像一面镜子。","这时有个人来喂它们。","「真意外！」鸽子说，「这一点也不无聊。」","他在沙滩上闲逛，捡起一些小块食物。","企鹅不可怕，它也不是英雄。","也许它只是一只了不起的动物，而这就够了。","有位科学家对它们做研究，能认出它们中的每一只。","有一天，一位工程师在岸边给它们建了一个小房子。","企鹅说：「太棒了。现在我们有个家了。」"],
 words:["penguin","pigeon","kilometre","speed","get lost","themselves","mirror","feed","surprise","boring","knock around","scary","hero","maybe","amazing","enough","research","recognise","several","engineer","fantastic","knock"],
 q:[{q:"企鹅的本领是什么？",a:["游得快，能游好几公里","飞回家不迷路","会建房子"],r:0},
    {q:"鸽子为什么说「不无聊」？",a:["因为有人来喂它们，有惊喜","因为它学会了游泳","因为天气很好"],r:0}]}

function getIll(o){var d=ILL[o.w];if(d)return '<span class="ill'+(d.m?' ic':'')+'">'+d.s+'</span>';return '<span class="ill emo">'+(o.e||"📘")+'</span>';}
var V={home:viewHome,card:viewCard,quiz:viewQuiz,ph:viewPh,read:viewRead,wrong:viewWrong};
var TABS=[["home","闯关地图"],["card","单词卡"],["quiz","听音练习"],["ph","音标专项"],["read","时文阅读"],["wrong","错题本"]];

function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove("on")},2000)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

var _voices=[];
function loadVoices(){try{_voices=window.speechSynthesis?window.speechSynthesis.getVoices():[]}catch(e){_voices=[]}}
if(window.speechSynthesis){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(){
  if(!_voices.length)loadVoices();
  var want=STATE.acc||"en-GB",pre=want.slice(0,2);
  var i,v;
  for(i=0;i<_voices.length;i++){v=_voices[i];if(v.lang&&v.lang.replace("_","-").indexOf(want)===0&&/(Serena|Daniel|Kate|Google UK|Microsoft (Libby|Sonia)|Female)/i.test(v.name))return v}
  for(i=0;i<_voices.length;i++){v=_voices[i];if(v.lang&&v.lang.replace("_","-").indexOf(want)===0)return v}
  for(i=0;i<_voices.length;i++){v=_voices[i];if(v.lang&&v.lang.replace("_","-").indexOf(pre)===0)return v}
  for(i=0;i<_voices.length;i++){v=_voices[i];if(v.lang&&v.lang.indexOf("en")===0)return v}
  return null;
}
var _seq=0;
function speak(text,rate,btn){
  if(!window.speechSynthesis){toast("这个浏览器不支持朗读，换 Chrome 或 Edge 试试");return}
  try{window.speechSynthesis.cancel()}catch(e){}
  var u=new SpeechSynthesisUtterance(String(text));
  u.lang=STATE.acc||"en-GB";u.rate=rate||STATE.rate||0.9;u.pitch=1;
  var v=pickVoice();if(v)u.voice=v;
  if(btn){btn.style.opacity=.45;u.onend=function(){btn.style.opacity=1};u.onerror=function(){btn.style.opacity=1}}
  window.speechSynthesis.speak(u);
}
var _seqToken=0;
function speakSeq(list,idx,els,token){
  if(token===undefined)token=++_seqToken;
  if(token!==_seqToken)return;
  if(els){for(var i=0;i<els.length;i++)els[i].classList.remove("playing");if(els[idx])els[idx].classList.add("playing")}
  if(idx>=list.length)return;
  if(!window.speechSynthesis){toast("这个浏览器不支持朗读，换 Chrome 或 Edge 试试");return}
  try{window.speechSynthesis.cancel()}catch(e){}
  var u=new SpeechSynthesisUtterance(String(list[idx]));
  u.lang=STATE.acc||"en-GB";u.rate=0.85;
  var v=pickVoice();if(v)u.voice=v;
  var done=false;
  function next(){
    if(done||token!==_seqToken)return;done=true;
    clearTimeout(window._seqT);
    window._seqT=setTimeout(function(){speakSeq(list,idx+1,els,token)},430);
  }
  u.onend=next;u.onerror=next;
  window._seqT=setTimeout(next,Math.max(3500,String(list[idx]).length*95+1500));
  window.speechSynthesis.speak(u);
}
function stopSeq(){_seqToken++;clearTimeout(window._seqT);try{window.speechSynthesis.cancel()}catch(e){}}

function setAcc(a){STATE.acc=a;save();toast(a==="en-GB"?"已切换为英式发音":"已切换为美式发音")}
function setRate(r){STATE.rate=parseFloat(r);document.getElementById("rateTxt").textContent=STATE.rate.toFixed(2);save()}
function openSet(){document.querySelectorAll("input[name=acc]").forEach(function(e){e.checked=(e.value===STATE.acc)});
  document.getElementById("rateR").value=STATE.rate;document.getElementById("rateTxt").textContent=STATE.rate.toFixed(2);
  document.getElementById("setModal").classList.add("on")}
function closeSet(){document.getElementById("setModal").classList.remove("on")}
document.getElementById("setModal").addEventListener("click",function(e){if(e.target===this)closeSet()});
function resetAll(){if(!confirm("清空所有学习记录和错题本？"))return;STATE.mark={};STATE.wrong={};STATE.stat={};save();closeSet();go("home");toast("已清空")}

function unitStat(id){
  var u=UNITS.filter(function(x){return x.id===id})[0],done=0,i;
  for(i=0;i<u.words.length;i++)if(STATE.mark[u.id+"-"+i]===1)done++;
  return {done:done,total:u.words.length};
}
function wrongList(){var a=[];for(var k in STATE.wrong)if(STATE.wrong[k]){var o=byUid(k);if(o)a.push(o)}return a}

function renderNav(){
  var h="",i;
  for(i=0;i<TABS.length;i++){
    var wc=(TABS[i][0]==="wrong"&&wrongList().length)?" ("+wrongList().length+")":"";
    h+='<button class="'+(VIEW===TABS[i][0]?"on":"")+'" onclick="go(\''+TABS[i][0]+'\')">'+TABS[i][1]+wc+'</button>';
  }
  document.getElementById("nav").innerHTML=h;
}
function go(v){if(VIEW!=="read")stopSeq();VIEW=v;renderNav();window.scrollTo(0,0);render()}
function render(){document.getElementById("app").innerHTML=V[VIEW]()}

function viewHome(){
  var total=allWords.length,done=0;for(var k in STATE.mark)if(STATE.mark[k]===1)done++;
  var pct=Math.round(done/total*100);
  var score=getScore(),rank=rankFor(score),next=RANKS.filter(function(r){return r.min>score})[0];
  var h='';
  h+='<div class="hero-card">'+
     '<div class="rank-card" style="margin:0 0 10px 0;border:0;background:transparent;padding:0">'+
     '<div class="rank-ico">'+rank.icon+'</div>'+
     '<div class="rank-info"><div class="rank-name">'+rank.name+'</div>'+
     '<div class="rank-next">'+(next?'距离 '+next.name+' 还差 '+(next.min-score)+' 分':'已是最高段位')+'</div></div>'+
     '<div style="text-align:right"><div class="score-num">'+score+'</div><div class="score-total">战斗力</div></div></div>'+
     '<div class="hp"><span>已掌握 '+done+' / '+total+' 词</span><span>'+pct+'%</span></div>'+
     '<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  h+='<div class="map-title">作战地图 · 共 7 关</div>';
  for(var i=0;i<UNITS.length;i++){

function beginQuiz(){
  var u=UNITS.filter(function(x){return x.id===curUnit})[0];
  var pool=u.words.slice(),list=[],i;
  for(i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t}
  for(i=0;i<Math.min(10,pool.length);i++)list.push(pool[i]);
  quiz.list=list;quiz.i=0;quiz.locked=false;nextQuiz();
}
function nextQuiz(){
  quiz.locked=false;
  if(quiz.i>=quiz.list.length){quiz.cur=null;return}
  quiz.cur=quiz.list[quiz.i];
  if(quiz.mode==="choice"){
    var opts=[quiz.cur.w],i,p;
    var pool=allWords.filter(function(x){return x.w!==quiz.cur.w});
    while(opts.length<4&&pool.length){
      i=Math.floor(Math.random()*pool.length);p=pool.splice(i,1)[0];
      if(opts.indexOf(p.w)<0)opts.push(p.w);
    }
    for(i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=opts[i];opts[i]=opts[j];opts[j]=t}
    quiz.cur.opts=opts;
  }
}

    h+='</div>';
  }else{
    h+='<div class="card"><input type="text" id="spellIn" placeholder="把听到的词写在这里" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key===\'Enter\')checkSpell()">'+

function viewWrong(){
  var list=wrongList();
  if(!list.length)return '<div class="card"><div class="empty">错题补给站是空的 🎒<br><span class="note">去「听音闯关」打几轮，答错的词会自动收在这里</span></div></div>';
  var h='<div class="card"><div class="hp"><span>共 '+list.length+' 个待补单词</span></div>'+
    '<div class="row" style="margin-top:12px"><button class="btn sm" onclick="reviewWrong()">🔄 全部复习</button>'+
    '<button class="btn ghost sm" onclick="clearWrong()">清空</button></div></div>';
  h+='<div class="card">';
  for(var i=0;i<list.length;i++){
    var w=list[i],u=unitLabel(w.unit);
    h+='<div class="wrong-item"><div class="ico">'+getIll(w)+'</div>'+
       '<button class="spk" style="width:38px;height:38px" onclick="speak(\''+w.w.replace(/'/g,"\\'")+'\',0.8)">'+
       '<svg viewBox="0 0 16 16" fill="none" style="width:17px;height:17px"><path d="M2 6h3l4-3v10L5 10H2z" fill="#fff"/><path d="M11 5.5a3.6 3.6 0 010 5" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></svg></button>'+
       '<div style="flex:1;min-width:0"><div class="w">'+esc(w.w)+(w.ipa?' <span style="font-family:var(--ipa);font-size:13px;color:var(--muted);font-weight:400">'+esc(w.ipa)+'</span>':'')+'</div>'+
       '<div class="m">'+(w.pos?esc(w.pos)+" ":"")+esc(w.cn)+' · '+esc(u?u.name:(w.unit==='starter'?'Starter':'Unit'))+'</div></div>'+
       '<button class="btn ghost sm" onclick="dropWrong(\''+w.uid+'\')">会了</button></div>';
  }
  h+='</div>';
  return h;
}
window.dropWrong=function(uid){delete STATE.wrong[uid];save();render();renderNav()};
window.clearWrong=function(){if(!confirm("清空错题本？"))return;STATE.wrong={};save();render();renderNav()};
window.reviewWrong=function(){
  var list=wrongList();
  if(!list.length)return;
  quiz.mode="choice";quiz.list=list.slice(0,10);quiz.i=0;
  var pool=allWords,i,p;
  quiz.list.forEach(function(w){
    var opts=[w.w];
    while(opts.length<4){
      p=pool[Math.floor(Math.random()*pool.length)];
      if(opts.indexOf(p.w)<0)opts.push(p.w);
    }
    for(i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=opts[i];opts[i]=opts[j];opts[j]=t}
    w.opts=opts;
  });
  quiz.cur=quiz.list[0];quiz.locked=false;
  wrongReview=true;go("quiz");
}
renderNav();render();
</script>
</body>
</html>
